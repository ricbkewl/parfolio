name: Build consolidated ParFolio Supabase installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/parfolio-v148-legacy-schema-bridge.sql'
      - 'supabase/atg-v148-compatibility.sql'
      - 'supabase/parfolio-v148-beta-account-bridge.sql'
      - 'supabase/parfolio-v148-courses-storage.sql'
      - 'supabase/parfolio-v148-security-hardening.sql'
      - 'supabase/parfolio-v148-realtime.sql'
      - '.github/workflows/build-parfolio-supabase-installer.yml'

permissions:
  contents: write

concurrency:
  group: parfolio-supabase-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one idempotent installer
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '-- ParFolio v148 complete Supabase installer'
            echo '-- Generated from the audited compatibility migrations. No ATG user/round/chat/private data is included.'
            echo '-- Existing incompatible beta round_players data is preserved in a private legacy table.'
            echo '-- Existing ParFolio beta profile, club-distance and admin-role data is preserved when compatible.'
            echo
            echo '-- ---- Legacy ParFolio schema bridge ----'
            cat supabase/parfolio-v148-legacy-schema-bridge.sql
            echo
            echo '-- ---- ATG v148 compatibility schema ----'
            cat supabase/atg-v148-compatibility.sql
            echo
            echo '-- ---- Existing ParFolio beta account-data bridge ----'
            cat supabase/parfolio-v148-beta-account-bridge.sql
            echo
            echo '-- ---- ParFolio local courses + storage supplement ----'
            cat supabase/parfolio-v148-courses-storage.sql
            echo
            echo '-- ---- ParFolio round/security hardening supplement ----'
            cat supabase/parfolio-v148-security-hardening.sql
            echo
            echo '-- ---- ParFolio Realtime compatibility ----'
            cat supabase/parfolio-v148-realtime.sql
          } > supabase/parfolio-v148-full.sql
      - name: Commit installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/parfolio-v148-full.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build complete ParFolio v148 Supabase installer'
          git pull --rebase origin main
          git push origin HEAD:main
