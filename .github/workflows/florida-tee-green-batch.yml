          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const rad=d=>d*Math.PI/180;
          const yards=(a,b,c,d)=>{
            const R=6371008.8, dLat=rad(c-a), dLng=rad(d-b);
            const x=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2;
            return 2*R*Math.asin(Math.sqrt(x))*1.0936133;
          };

          function decodeXml(s){
            return s.replaceAll("&quot;",'"').replaceAll("&apos;","'").replaceAll("&amp;","&").replaceAll("&lt;","<").replaceAll("&gt;",">");
          }

          async function processCourse([id,name,city,lat,lng,expected]){
            if(!Number.isFinite(lat)||!Number.isFinite(lng)) return {id,name,city,expected,status:'fetch_error',reason:'Missing catalog coordinates',holes:[]};
            const d=expected===9?0.010:0.012;
            const minlat=lat-d,maxlat=lat+d,minlon=lng-d,maxlon=lng+d;
            const url=`https://api.openstreetmap.org/api/0.6/map?bbox=${minlon},${minlat},${maxlon},${maxlat}`;
            try{
              let res=null;
              for(let attempt=0;attempt<4;attempt++){
                const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),22000);
                try{
                  res=await fetch(url,{signal:ctl.signal,headers:{"User-Agent":"ParFolio-TeeGreen-Batch/1.6"}});
                } finally { clearTimeout(timer); }
                if(res.ok) break;
                if(res.status===509 || res.status===429 || res.status>=500){
                  await sleep(2500*(attempt+1));
                  continue;
                }
                throw new Error("OSM map "+res.status);
              }
              if(!res?.ok) throw new Error("OSM map "+(res?.status||"fetch_failed"));
              const xml=await res.text();
              const nodes=new Map();
              for(const m of xml.matchAll(/<node\s+([^>]*?)\/?>(?:<\/node>)?/g)){
                const a=m[1];
                const idm=a.match(/\bid="(\d+)"/), latm=a.match(/\blat="([^"]+)"/), lonm=a.match(/\blon="([^"]+)"/);
                if(idm&&latm&&lonm) nodes.set(idm[1],{lat:+latm[1],lon:+lonm[1]});
              }
              const rows=[];
              for(const m of xml.matchAll(/<way\s+([^>]*\bid="(\d+)"[^>]*)>([\s\S]*?)<\/way>/g)){
                const attrs=m[1],wayId=m[2],body=m[3],tags={};
                const timestamp=(attrs.match(/\btimestamp="([^"]+)"/)||[])[1]||null;
                const version=Number((attrs.match(/\bversion="(\d+)"/)||[])[1]||0);
                for(const t of body.matchAll(/<tag\s+k="([^"]+)"\s+v="([^"]*)"\s*\/>/g)) tags[decodeXml(t[1])]=decodeXml(t[2]);
                if(tags.golf!=="hole") continue;
                const hole=parseInt(tags.ref||"",10);
                if(!Number.isInteger(hole)||hole<1||hole>expected) continue;
                const refs=[...body.matchAll(/<nd\s+ref="(\d+)"\s*\/>/g)].map(x=>x[1]);
                if(refs.length<2) continue;
                const first=nodes.get(refs[0]),last=nodes.get(refs.at(-1));
                if(!first||!last) continue;
                rows.push({hole_number:hole,par:/^[2-7]$/.test(tags.par||"")?parseInt(tags.par,10):null,tee_lat:first.lat,tee_lng:first.lon,green_center_lat:last.lat,green_center_lng:last.lon,yards:yards(first.lat,first.lon,last.lat,last.lon),osm_way_id:+wayId,osm_timestamp:timestamp,osm_version:version});
              }
              const groups=new Map();
              for(const h of rows){if(!groups.has(h.hole_number))groups.set(h.hole_number,[]);groups.get(h.hole_number).push(h);}
              const selected=[...groups.entries()].map(([hole,items])=>{
                items.sort((a,b)=>{
                  const ta=a.osm_timestamp?Date.parse(a.osm_timestamp):0;
                  const tb=b.osm_timestamp?Date.parse(b.osm_timestamp):0;
                  if(tb!==ta) return tb-ta;
                  if(b.osm_version!==a.osm_version) return b.osm_version-a.osm_version;
                  return b.osm_way_id-a.osm_way_id;
                });
                return items[0];
              }).sort((a,b)=>a.hole_number-b.hole_number);
              const duplicate_holes=[...groups.entries()].filter(([,v])=>v.length>1).map(([hole,v])=>({hole_number:hole,candidates:v.length,selected_way_id:v.slice().sort((a,b)=>(Date.parse(b.osm_timestamp||0)-Date.parse(a.osm_timestamp||0))||b.osm_version-a.osm_version||b.osm_way_id-a.osm_way_id)[0].osm_way_id}));
              const complete=selected.length===expected&&Array.from({length:expected},(_,i)=>i+1).every((n,i)=>selected[i]?.hole_number===n);
              const plausible=complete&&selected.every(h=>h.yards>=20&&h.yards<=1000);
              return {id,name,city,expected,status:complete&&plausible?"validated":"unresolved",raw_way_count:rows.length,unique_holes:selected.length,duplicate_holes,holes:complete&&plausible?selected:[]};
            }catch(e){return {id,name,city,expected,status:"fetch_error",reason:String(e),holes:[]};}
          }

          const out=new Array(courses.length);
          let next=0;
          async function worker(){
            while(true){
              const i=next++;
              if(i>=courses.length) return;
              out[i]=await processCourse(courses[i]);
              console.log(courses[i][1],out[i].status,out[i].unique_holes??0);
              await sleep(300);
            }
          }
          await Promise.all(Array.from({length:2},()=>worker()));
          await fs.mkdir("data",{recursive:true});
          await fs.writeFile("data/fl-tee-green-results.json",JSON.stringify({generated_at:new Date().toISOString(),courses:out},null,2));
          NODE
          node /tmp/fl-tee-green.mjs
      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fl-tee-green-results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Florida tee-green endpoint batch"
          git push
