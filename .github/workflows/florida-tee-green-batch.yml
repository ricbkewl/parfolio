name: Florida Tee Green Batch

on:
  push:
    paths:
      - '.github/workflows/florida-tee-green-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: florida-tee-green-batch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch tee and green endpoints
        shell: bash
        run: |
          cat > /tmp/fl-tee-green.mjs <<'NODE'
          import fs from 'node:fs/promises';

          const courses = [
            ["d846c857-9fe5-49fd-8f79-1efc84a5a067","Crandon Golf At Key Biscayne","Key Biscayne",25.7163907,-80.1592507,18],
            ["a416f010-81c1-4d4f-953c-0bcbc0e62b83","Crane Watch Club","Palm City",27.200816,-80.312117,18],
            ["e026d31c-a535-42c5-886f-dcf5af44aebb","Davie Golf Country Club","Davie",26.0908847,-80.2582796,18],
            ["72e4eebe-5ebb-47de-ba03-5a349f577da1","Deer Creek Golf Club","Deerfield Beach",26.32073,-80.141914,18],
            ["83a675a8-4804-4bfa-b962-eb202bee0812","Deering Bay Yacht Country Club","Miami",25.6375,-80.2916667,18],
            ["cb1d5846-dccf-46c4-8895-ba6b6b1b04fc","Delray Beach Golf Club","Delray Beach",26.4519564,-80.097697,18],
            ["bd90d524-ac9d-42e9-9aae-b1e85ac3eec6","Delray Dunes Golf Country Club","Boynton Beach",26.498239,-80.1162662,18],
            ["a7b5c92b-f31e-404c-a39b-33c0093f8fdf","Dutchmans Pipe Golf Club","West Palm Beach",26.7354033,-80.0841692,18],
            ["757ef99f-e5bc-4397-a743-39c5f772ff09","Eagle Trace Country Club","Coral Springs",26.2518992,-80.2891074,18],
            ["65333a41-db20-4bf4-aea5-5a6d5ba703c9","Eaglewood Country Club","Hobe Sound",27.0475208,-80.1402902,18]
          ];

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const rad=d=>d*Math.PI/180;
          const yards=(a,b,c,d)=>{
            const R=6371008.8, dLat=rad(c-a), dLng=rad(d-b);
            const x=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2;
            return 2*R*Math.asin(Math.sqrt(x))*1.0936133;
          };

          function decodeXml(s){
            return s.replaceAll("&quot;",'"').replaceAll("&apos;","'").replaceAll("&amp;","&").replaceAll("&lt;","<").replaceAll("&gt;",">");
          }

          async function processCourse([id,name,city,lat,lng,expected]){
            const d=expected===9?0.010:0.012;
            const minlat=lat-d,maxlat=lat+d,minlon=lng-d,maxlon=lng+d;
            const url=`https://api.openstreetmap.org/api/0.6/map?bbox=${minlon},${minlat},${maxlon},${maxlat}`;
            try{
              const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),18000);
              const res=await fetch(url,{signal:ctl.signal,headers:{"User-Agent":"ParFolio-TeeGreen-Batch/1.5"}});
              clearTimeout(timer);
              if(!res.ok) throw new Error("OSM map "+res.status);
              const xml=await res.text();
              const nodes=new Map();
              for(const m of xml.matchAll(/<node\s+([^>]*?)\/?>(?:<\/node>)?/g)){
                const a=m[1];
                const idm=a.match(/\bid="(\d+)"/), latm=a.match(/\blat="([^"]+)"/), lonm=a.match(/\blon="([^"]+)"/);
                if(idm&&latm&&lonm) nodes.set(idm[1],{lat:+latm[1],lon:+lonm[1]});
              }
              const rows=[];
              for(const m of xml.matchAll(/<way\s+[^>]*\bid="(\d+)"[^>]*>([\s\S]*?)<\/way>/g)){
                const wayId=m[1],body=m[2],tags={};
                for(const t of body.matchAll(/<tag\s+k="([^"]+)"\s+v="([^"]*)"\s*\/>/g)) tags[decodeXml(t[1])]=decodeXml(t[2]);
                if(tags.golf!=="hole") continue;
                const hole=parseInt(tags.ref||"",10);
                if(!Number.isInteger(hole)||hole<1||hole>expected) continue;
                const refs=[...body.matchAll(/<nd\s+ref="(\d+)"\s*\/>/g)].map(x=>x[1]);
                if(refs.length<2) continue;
                const first=nodes.get(refs[0]),last=nodes.get(refs.at(-1));
                if(!first||!last) continue;
                rows.push({hole_number:hole,par:/^[2-7]$/.test(tags.par||"")?parseInt(tags.par,10):null,tee_lat:first.lat,tee_lng:first.lon,green_center_lat:last.lat,green_center_lng:last.lon,yards:yards(first.lat,first.lon,last.lat,last.lon),osm_way_id:+wayId});
              }
              const groups=new Map();
              for(const h of rows){if(!groups.has(h.hole_number))groups.set(h.hole_number,[]);groups.get(h.hole_number).push(h);}
              const unique=[...groups.entries()].filter(([,v])=>v.length===1).map(([,v])=>v[0]).sort((a,b)=>a.hole_number-b.hole_number);
              const complete=unique.length===expected&&Array.from({length:expected},(_,i)=>i+1).every((n,i)=>unique[i]?.hole_number===n);
              const plausible=complete&&unique.every(h=>h.yards>=20&&h.yards<=1000);
              return {id,name,city,expected,status:complete&&plausible?"validated":"unresolved",raw_way_count:rows.length,unique_holes:unique.length,holes:complete&&plausible?unique:[]};
            }catch(e){return {id,name,city,expected,status:"fetch_error",reason:String(e),holes:[]};}
          }

          const out=new Array(courses.length);
          let next=0;
          async function worker(){
            while(true){
              const i=next++;
              if(i>=courses.length) return;
              out[i]=await processCourse(courses[i]);
              console.log(courses[i][1],out[i].status,out[i].unique_holes??0);
              await sleep(300);
            }
          }
          await Promise.all(Array.from({length:4},()=>worker()));
          await fs.mkdir("data",{recursive:true});
          await fs.writeFile("data/fl-tee-green-results.json",JSON.stringify({generated_at:new Date().toISOString(),courses:out},null,2));
          NODE
          node /tmp/fl-tee-green.mjs
      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fl-tee-green-results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Florida tee-green endpoint batch"
          git push
