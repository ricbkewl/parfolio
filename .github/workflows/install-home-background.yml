name: Install ParFolio Homepage Background

on:
  push:
    paths:
      - '.github/workflows/install-home-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild optimized homepage background
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-home-bg-part01.txt .tmp-home-bg-part02.txt .tmp-home-bg-part03.txt .tmp-home-bg-part04.txt .tmp-home-bg-part05.txt .tmp-home-bg-part06.txt .tmp-home-bg-part07.txt .tmp-home-bg-part08.txt | base64 --decode > parfolio-home-bg-v162.webp
          test -s parfolio-home-bg-v162.webp
          file parfolio-home-bg-v162.webp
      - name: Commit final asset and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parfolio-home-bg-v162.webp
          git rm .tmp-home-bg-part01.txt .tmp-home-bg-part02.txt .tmp-home-bg-part03.txt .tmp-home-bg-part04.txt .tmp-home-bg-part05.txt .tmp-home-bg-part06.txt .tmp-home-bg-part07.txt .tmp-home-bg-part08.txt
          git rm .github/workflows/install-home-background.yml
          git commit -m 'Install ParFolio golf homepage background'
          git pull --rebase origin main
          git push origin HEAD:main
