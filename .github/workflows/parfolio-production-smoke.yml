name: ParFolio production smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'manifest.webmanifest'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check production app shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, re, pathlib, datetime, time
          base='https://parfolio-iota.vercel.app/'
          # Give Vercel a short window to deploy the commit that triggered this run.
          time.sleep(8)
          def get(path):
            url=base+path.lstrip('/')
            req=urllib.request.Request(url,headers={'User-Agent':'ParFolio-production-smoke/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                return r.status,r.read().decode('utf-8','replace'),r.headers.get('content-type','')
            except urllib.error.HTTPError as e:
              return e.code,e.read().decode('utf-8','replace'),e.headers.get('content-type','')
            except Exception as e:
              return 'ERROR',str(e),''
          status,index,_=get('')
          refs=[]
          if status==200:
            refs+=re.findall(r'<script[^>]+src=["\']([^"\']+)',index,re.I)
            refs+=re.findall(r'<link[^>]+href=["\']([^"\']+)',index,re.I)
          local=[]
          for ref in refs:
            if ref.startswith(('http://','https://','//','data:')): continue
            path=ref.split('?',1)[0].lstrip('./')
            if path and path not in local: local.append(path)
          # Critical files that may be loaded dynamically rather than directly by index.
          for path in ['app.js','service-worker.js','manifest.webmanifest','parfolio-app-icon.png','rick-kulon-profile.jpg','shared-course-library-v145.js','parfolio-branding.js']:
            if path not in local: local.append(path)
          rows=[]
          for path in local:
            s,body,ctype=get(path)
            rows.append((path,s,ctype))
          missing=[r for r in rows if r[1]!=200]
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          lines=['# ParFolio Production Smoke Test','',f'Generated: {now}',f'Production root: `{status}`','',
                 '| Asset | HTTP | Content-Type |','|---|---:|---|']
          for path,s,ctype in rows: lines.append(f'| `{path}` | `{s}` | `{ctype}` |')
          lines+=['','## Result','',f'Checked **{len(rows)}** production assets. Missing/unhealthy: **{len(missing)}**.','']
          pathlib.Path('PARFOLIO-PRODUCTION-SMOKE.md').write_text('\n'.join(lines))
          if status!=200 or missing:
            raise SystemExit('Production smoke test found missing assets: '+', '.join(x[0] for x in missing))
          PY
      - name: Commit smoke report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PARFOLIO-PRODUCTION-SMOKE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record ParFolio production smoke test'
          git push
