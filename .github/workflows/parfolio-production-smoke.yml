name: ParFolio production smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'manifest.webmanifest'
      - 'parfolio-public-config.json'
      - '.github/workflows/parfolio-production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub Pages production app shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, re, pathlib, datetime, time
          base='https://ricbkewl.github.io/parfolio/'
          time.sleep(15)
          def get(path):
            url=base+path.lstrip('/')
            req=urllib.request.Request(url,headers={'User-Agent':'ParFolio-production-smoke/3.0','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                return r.status,r.read().decode('utf-8','replace'),r.headers.get('content-type','')
            except urllib.error.HTTPError as e:
              return e.code,e.read().decode('utf-8','replace'),e.headers.get('content-type','')
            except Exception as e:
              return 'ERROR',str(e),''
          status,index,_=get('')
          refs=[]
          if status==200:
            refs+=re.findall(r'<script[^>]+src=["\']([^"\']+)',index,re.I)
            refs+=re.findall(r'<link[^>]+href=["\']([^"\']+)',index,re.I)
          local=[]
          for ref in refs:
            if ref.startswith(('http://','https://','//','data:')): continue
            path=ref.split('?',1)[0].lstrip('./')
            if path and path not in local: local.append(path)
          for path in ['app.js','service-worker.js','manifest.webmanifest','parfolio-public-config.json','parfolio-app-icon.png','shared-course-library-v145.js','universal-gps-course-loader-v287.js','google-maps-clean-v269.js','course-search-input-v289.js','course-interactions-v290.js']:
            if path not in local: local.append(path)
          rows=[]
          for path in local:
            s,body,ctype=get(path)
            rows.append((path,s,ctype))
          missing=[r for r in rows if r[1]!=200]
          stale=[]
          if status==200:
            if 'ParFolio' not in index: stale.append('production HTML does not identify ParFolio')
            if 'universal-gps-course-loader-v287.js' not in index: stale.append('universal GPS loader is not loaded')
            if 'course-search-input-v289.js' not in index: stale.append('current search input stabilizer is not loaded')
          cfg_status,cfg,_=get('parfolio-public-config.json')
          if cfg_status==200 and 'https://ricbkewl.github.io/parfolio/' not in cfg:
            stale.append('public config app_url does not target GitHub Pages production')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          lines=['# ParFolio Production Smoke Test','',f'Generated: {now}',f'Production URL: `{base}`',f'Production root: `{status}`','',
                 '| Asset | HTTP | Content-Type |','|---|---:|---|']
          for path,s,ctype in rows: lines.append(f'| `{path}` | `{s}` | `{ctype}` |')
          lines+=['','## Result','',f'Checked **{len(rows)}** production assets. Missing/unhealthy: **{len(missing)}**. Runtime/config mismatches: **{len(stale)}**.','']
          if stale:
            lines+=['## Runtime/config mismatches','']+[f'- {item}' for item in stale]+['']
          pathlib.Path('PARFOLIO-PRODUCTION-SMOKE.md').write_text('\n'.join(lines))
          if status!=200 or missing or stale:
            problems=[x[0] for x in missing]+stale
            raise SystemExit('GitHub Pages production smoke test failed: '+', '.join(problems))
          PY
      - name: Publish smoke summary
        shell: bash
        run: |
          cat PARFOLIO-PRODUCTION-SMOKE.md >> "$GITHUB_STEP_SUMMARY"
