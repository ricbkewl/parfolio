name: Production audit v221
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'tests/**'
      - '.github/workflows/production-audit-v221.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit regressions
        run: |
          for test in tests/*.mjs; do node "$test"; done
      - name: Wait for Vercel production deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' https://parfolio-iota.vercel.app/ >/tmp/parfolio-index.html; then
              if grep -q 'ParFolio' /tmp/parfolio-index.html; then
                sleep 8
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Vercel production did not become reachable in time' >&2
          exit 1
      - name: Browser dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Live Vercel production audit
        run: node tests/production-audit-v221.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-audit-v221
          path: audit-results/
          retention-days: 14
