name: ParFolio Systemwide Production Diagnostic v182

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/systemwide-production-diagnostic-v181.yml'
      - 'index.html'
      - 'app.js'
      - 'play-v108.js'
      - 'play-camera-v137.js'
      - 'hole-flyover-v129.js'
      - 'editor-route-yardages-v135.js'
      - 'editor-edited-holes-v138.js'
      - 'service-worker.js'
      - 'tests/systemwide-static-v182.mjs'
      - 'smart-course-search-v176.js'
      - 'smart-course-search-v176-fix.js'
      - 'course-map-browser-v163.js'
      - 'parfolio-google-vector-v149.js'
      - 'editor-provider-v117.js'
      - 'shared-course-library-v145.js'
      - 'parfolio-contact-v168.js'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v182 source and offline checks
        run: node tests/systemwide-static-v182.mjs

  browser:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run systemwide production checks
        shell: bash
        run: |
          sleep 18
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const BASE='https://ricbkewl.github.io/parfolio/';
          const results=[];
          function add(view,test,ok,detail=''){results.push({view,test,ok:!!ok,detail:String(detail||'')});}
          async function runView(browser,name,viewport){
            const context=await browser.newContext({viewport,geolocation:{latitude:34.1064,longitude:-117.5931},permissions:['geolocation']});
            const page=await context.newPage();
            const pageErrors=[],badResponses=[],failedRequests=[],consoleErrors=[],consoleWarnings=[];
            page.on('pageerror',e=>pageErrors.push(e.message||String(e)));
            page.on('requestfailed',r=>failedRequests.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            page.on('response',r=>{if(r.status()>=400)badResponses.push(`${r.status()} ${r.url()}`)});
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());if(m.type()==='warning'||m.type()==='warn')consoleWarnings.push(m.text())});
            let gotoError='';
            try{await page.goto(BASE+'?systemwide=182&view='+name,{waitUntil:'domcontentloaded',timeout:30000});}catch(e){gotoError=e.message}
            await page.waitForTimeout(7000);
            const shell=await page.evaluate(()=>({
              ready:document.readyState,
              title:document.title,
              appLen:document.querySelector('#app')?.innerHTML?.length||0,
              text:document.body.innerText||'',
              overflow:document.documentElement.scrollWidth-window.innerWidth,
              supabase:typeof window.supabase,
              leaflet:typeof window.L,
              render:typeof window.render,
              coursesType:typeof courses,
              courseCount:typeof courses!=='undefined'&&Array.isArray(courses)?courses.length:-1,
              shared:window.PARFOLIO_SHARED_LIBRARY||null,
              swSupported:'serviceWorker' in navigator
            }));
            add(name,'Production page loads',!gotoError&&shell.ready==='complete'&&shell.appLen>1000,gotoError||`ready=${shell.ready}, app=${shell.appLen}`);
            add(name,'ParFolio branding visible',/Par\s*Folio/i.test(shell.text)&&/Play\. Connect\. Improve/i.test(shell.text),'home branding');
            add(name,'No ATG/Agape visible branding',!/Agape Tumou|Faith · Fellowship|Saved to Serve|2 Timothy/i.test(shell.text),'visible text scan');
            add(name,'No horizontal page overflow',shell.overflow<=3,`overflow=${shell.overflow}px`);
            add(name,'Supabase client available',shell.supabase==='object',shell.supabase);
            add(name,'Leaflet available',shell.leaflet==='object',shell.leaflet);
            add(name,'Core render function available',shell.render==='function',shell.render);

            const manifest=await page.evaluate(async()=>{try{const r=await fetch('manifest.webmanifest',{cache:'no-store'});return{status:r.status,json:await r.json()}}catch(e){return{status:0,error:String(e)}}});
            add(name,'Manifest loads',manifest.status===200&&manifest.json?.name,`status=${manifest.status}, name=${manifest.json?.name||''}`);
            const sw=await page.evaluate(async()=>{try{if(!('serviceWorker' in navigator))return{supported:false};const reg=await navigator.serviceWorker.register('./service-worker.js');await navigator.serviceWorker.ready;return{supported:true,scope:reg.scope,active:!!reg.active}}catch(e){return{supported:true,error:String(e)}}});
            add(name,'Service worker registers',sw.supported&&sw.active&&!sw.error,sw.error||sw.scope||'');

            const backend=await page.evaluate(async()=>{
              const headers={apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${SUPABASE_PUBLISHABLE_KEY}`};
              const out={};
              try{let r=await fetch(`${SUPABASE_URL}/auth/v1/settings`,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY}});out.auth=r.status}catch(e){out.auth=0;out.authError=String(e)}
              try{let r=await fetch(`${SUPABASE_URL}/rest/v1/courses?select=id,name&limit=1`,{headers});out.courses=r.status;out.courseBody=(await r.text()).slice(0,250)}catch(e){out.courses=0;out.courseError=String(e)}
              return out;
            });
            add(name,'Supabase Auth endpoint reachable',backend.auth===200,`status=${backend.auth}`);
            // Local admin workspace may be authenticated-only, but signed-out startup must not depend on it.
            add(name,'Local courses workspace response understood',[200,401].includes(backend.courses),`status=${backend.courses} ${backend.courseBody||backend.courseError||''}`);

            const readme=page.getByText('Readme',{exact:true});
            if(await readme.count()){
              await readme.first().click().catch(()=>{});await page.waitForTimeout(500);
              const bg=await page.evaluate(()=>{const el=document.querySelector('.home-background,.home-bg,.premium-home-bg,[class*="home-bg"]');return{bodyBg:getComputedStyle(document.body).backgroundImage,found:!!el,display:el?getComputedStyle(el).display:''}});
              add(name,'Readme opens without losing home background',bg.found||bg.bodyBg!=='none',JSON.stringify(bg));
            }else add(name,'Readme control present',false,'Readme control not found');

            // Force one shared-library load and inspect its actual result.
            const shared=await page.evaluate(async()=>{
              try{if(typeof loadSharedCourseLibrary==='function')await loadSharedCourseLibrary({rerender:false,retries:0});return{status:window.PARFOLIO_SHARED_LIBRARY||null,count:typeof courses!=='undefined'&&Array.isArray(courses)?courses.length:-1}}catch(e){return{error:String(e),status:window.PARFOLIO_SHARED_LIBRARY||null,count:typeof courses!=='undefined'&&Array.isArray(courses)?courses.length:-1}}
            });
            add(name,'Shared Golf Course Library loads',!!shared.status?.loaded&&shared.status.catalogRows>100,JSON.stringify(shared));

            let coursesState={};
            try{
              await page.waitForFunction(()=>typeof courses!=='undefined'&&Array.isArray(courses)&&courses.length>100,{timeout:12000});
              coursesState=await page.evaluate(()=>({count:courses.length,shared:window.PARFOLIO_SHARED_LIBRARY||null}));
              add(name,'Course catalog loads >100 entries',coursesState.count>100,`count=${coursesState.count}`);
              await page.evaluate(()=>{s.v='coursesView';render()});
              await page.waitForTimeout(1200);
              const cview=await page.evaluate(()=>({
                placeholder:document.querySelector('.course-library-search input')?.placeholder||'',
                mapLaunch:!!document.querySelector('.course-map-launch'),
                oldLocationVisible:[...document.querySelectorAll('*')].some(el=>/Search by Location/i.test(el.textContent||'')&&getComputedStyle(el).display!=='none'&&el.offsetParent!==null),
                overflow:document.documentElement.scrollWidth-window.innerWidth
              }));
              add(name,'Universal course search present',/course|city|zip|area/i.test(cview.placeholder),cview.placeholder);
              add(name,'Floating Map launcher present',cview.mapLaunch,'6 o’clock map launcher');
              add(name,'Legacy location search hidden',!cview.oldLocationVisible,`oldVisible=${cview.oldLocationVisible}`);
              add(name,'Courses view has no horizontal overflow',cview.overflow<=3,`overflow=${cview.overflow}px`);

              const input=page.locator('.course-library-search input').first();
              await input.fill('Siera Lakes');await page.waitForTimeout(700);
              let searchText=(await page.locator('#app').innerText()).toLowerCase();
              add(name,'Typo search finds Sierra Lakes',searchText.includes('sierra lakes'),'query=Siera Lakes');
              await input.fill('Cortland NY');await page.waitForTimeout(700);
              searchText=(await page.locator('#app').innerText()).toLowerCase();
              add(name,'City/state search returns results',/course[s]? found|cortland/.test(searchText),'query=Cortland NY');
              await input.fill('');await page.waitForTimeout(300);

              const mapBtn=page.locator('.course-map-launch').first();
              if(await mapBtn.count()){
                await mapBtn.click();await page.waitForTimeout(1800);
                const mapState=await page.evaluate(()=>({leafletMaps:document.querySelectorAll('.leaflet-container').length,body:(document.body.innerText||'').slice(-1000)}));
                add(name,'Floating course map opens',mapState.leafletMaps>0||/Open Course|Locate|List/i.test(mapState.body),`leaflet=${mapState.leafletMaps}`);
                await page.keyboard.press('Escape').catch(()=>{});
              }
            }catch(e){
              add(name,'Course catalog/view diagnostics',false,`${e.message||e}; initialCount=${shell.courseCount}; shared=${JSON.stringify(shell.shared)}; warnings=${consoleWarnings.join(' | ')}`);
            }

            const gm=await page.evaluate(async()=>{
              window.__PARFOLIO_GM_AUTH_FAILURE=false;
              window.gm_authFailure=()=>{window.__PARFOLIO_GM_AUTH_FAILURE=true};
              try{
                await Promise.race([loadGoogleMaps(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),12000))]);
                const div=document.createElement('div');div.style.cssText='position:fixed;left:-9999px;width:320px;height:240px';document.body.appendChild(div);
                const map=new google.maps.Map(div,{center:{lat:34.1064,lng:-117.5931},zoom:15,mapId:'DEMO_MAP_ID',renderingType:google.maps.RenderingType.VECTOR,mapTypeId:'satellite',heading:0,tilt:45});
                await new Promise(r=>setTimeout(r,2600));
                const text=div.textContent||'';
                return{loaded:!!window.google?.maps,map:!!map,vector:map.getRenderingType?.()===google.maps.RenderingType.VECTOR,heading:map.getHeading?.(),tilt:map.getTilt?.(),authFailure:!!window.__PARFOLIO_GM_AUTH_FAILURE,errorOverlay:/oops!?\s*something went wrong|didn.t load google maps correctly/i.test(text)};
              }catch(e){return{loaded:false,error:String(e),authFailure:!!window.__PARFOLIO_GM_AUTH_FAILURE}}
            });
            add(name,'Google Satellite initializes',gm.loaded&&gm.map&&!gm.authFailure&&!gm.errorOverlay,JSON.stringify(gm));
            add(name,'Google Vector camera initializes',gm.vector&&Number.isFinite(gm.heading)&&Number.isFinite(gm.tilt),JSON.stringify(gm));

            const meaningfulBad=badResponses.filter(x=>!(/\/auth\/v1\/user\b/.test(x)&&x.startsWith('401 '))&&!(/\/rest\/v1\/courses\b/.test(x)&&x.startsWith('401 ')));
            const meaningfulConsole=consoleErrors.filter(x=>!(/Failed to load resource.*401/i.test(x)));
            const cameraWarnings=consoleWarnings.filter(x=>/heading|tilt|raster|google\.maps\.Marker is deprecated|map id.*advanced marker/i.test(x));
            add(name,'No page JavaScript errors',pageErrors.length===0,pageErrors.join(' | '));
            add(name,'No failed network requests',failedRequests.length===0,failedRequests.join(' | '));
            add(name,'No unexpected HTTP 4xx/5xx',meaningfulBad.length===0,meaningfulBad.join(' | '));
            add(name,'No meaningful console errors',meaningfulConsole.length===0,meaningfulConsole.join(' | '));
            add(name,'No Google camera or marker warnings',cameraWarnings.length===0,cameraWarnings.join(' | '));
            await context.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            await runView(browser,'mobile',{width:390,height:844});
            await runView(browser,'desktop',{width:1440,height:900});
            await browser.close();

            const index=fs.readFileSync('index.html','utf8');
            const app=fs.readFileSync('app.js','utf8');
            const sw=fs.readFileSync('service-worker.js','utf8');
            add('static','Dangerous Smart Golf v169 not globally loaded',!/<script[^>]+smart-golf-data-v169\.js/i.test(index),'index.html');
            add('static','Old clock camera v151 not globally loaded',!/<script[^>]+parfolio-clock-camera-v151\.js/i.test(index),'preserve ATG camera behavior');
            add('static','No Vercel runtime dependency',!/vercel\.app|vercel\.com/i.test(index+app),'GitHub Pages primary');
            add('static','No service-role secret in client',!/service_role|sb_secret_[A-Za-z0-9_-]+/i.test(index+app),'client source scan');
            add('static','Service worker cache is current v180+',/CACHE_NAME=['"]parfolio-v(?:18[0-9]|[2-9][0-9]{2})/.test(sw),sw.match(/CACHE_NAME=([^;]+)/)?.[1]||'');
            const externalCritical=(index.match(/https:\/\/(?:unpkg\.com|cdn\.jsdelivr\.net)[^"']+/g)||[]);
            add('static','Critical libraries are not CDN-only',externalCritical.length===0,externalCritical.join(' | '));

            console.log('\n=== PARFOLIO SYSTEMWIDE DIAGNOSTIC ===');
            for(const r of results) console.log(`${r.ok?'PASS':'FAIL'} [${r.view}] ${r.test}${r.detail?' :: '+r.detail:''}`);
            const fails=results.filter(r=>!r.ok);
            console.log(`\nTOTAL ${results.length} | PASS ${results.length-fails.length} | FAIL ${fails.length}`);
            if(fails.length) process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
