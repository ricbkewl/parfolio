name: Update ParFolio Golf Feed

on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parfolio-golf-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh golf content
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-golf-feed.mjs
      - name: Commit feed if changed
        run: |
          if git diff --quiet -- data/golf-feed.json; then
            echo "Golf Feed already current"
            exit 0
          fi
          git config user.name "ParFolio Golf Feed Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/golf-feed.json
          git commit -m "Refresh automatic Golf Feed"
          git push
