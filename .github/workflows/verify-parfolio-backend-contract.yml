name: Verify ParFolio backend contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'supabase/atg-v148-compatibility.sql'
      - '.github/workflows/verify-parfolio-backend-contract.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare frontend Supabase dependencies with migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, datetime

          js=Path('app.js').read_text()
          sql=Path('supabase/atg-v148-compatibility.sql').read_text()
          tables=sorted(set(re.findall(r"\.from\(['\"]([^'\"]+)['\"]\)",js)))
          rpcs=sorted(set(re.findall(r"\.rpc\(['\"]([^'\"]+)['\"]",js)))
          buckets=sorted(set(re.findall(r"\.storage\.from\(['\"]([^'\"]+)['\"]\)",js)))

          def table_present(name):
            patterns=[rf'create\s+table\s+(?:if\s+not\s+exists\s+)?(?:public\.)?{re.escape(name)}\b',rf'alter\s+table\s+(?:public\.)?{re.escape(name)}\b']
            return any(re.search(p,sql,re.I) for p in patterns)
          def rpc_present(name):
            return bool(re.search(rf'create\s+(?:or\s+replace\s+)?function\s+(?:public\.)?{re.escape(name)}\s*\(',sql,re.I))
          def bucket_present(name):
            return name in sql

          missing_tables=[x for x in tables if not table_present(x)]
          missing_rpcs=[x for x in rpcs if not rpc_present(x)]
          missing_buckets=[x for x in buckets if not bucket_present(x)]
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          lines=['# ParFolio Frontend ↔ Supabase Contract','',f'Generated: {now}','',
                 '## Frontend dependencies','',
                 f'Tables: {", ".join(f"`{x}`" for x in tables)}','',
                 f'RPCs: {", ".join(f"`{x}`" for x in rpcs)}','',
                 f'Storage buckets: {", ".join(f"`{x}`" for x in buckets)}','',
                 '## Migration coverage','',
                 f'Missing tables: {", ".join(f"`{x}`" for x in missing_tables) if missing_tables else "None"}','',
                 f'Missing RPCs: {", ".join(f"`{x}`" for x in missing_rpcs) if missing_rpcs else "None"}','',
                 f'Missing buckets: {", ".join(f"`{x}`" for x in missing_buckets) if missing_buckets else "None"}','']
          Path('PARFOLIO-BACKEND-CONTRACT.md').write_text('\n'.join(lines))
          if missing_tables or missing_rpcs or missing_buckets:
            print('Migration does not fully cover the current frontend contract.')
          PY
      - name: Commit contract report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PARFOLIO-BACKEND-CONTRACT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify ParFolio backend migration contract'
          git push
